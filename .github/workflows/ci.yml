name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.11", "3.12", "3.13"]
        exclude:
          - os: macos-latest
            python: "3.9"
          - os: windows-latest
            python: "3.9"
    env:
      PYTHONUTF8: "1"
      NO_COLOR: "1"
      NAVHACK_HOME: ${{ github.workspace }}/.navhack-ci
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: install (packaging check)
        run: python -m pip install --upgrade pip && python -m pip install .

      - name: doctor
        run: navhack doctor

      - name: unit tests
        run: python -m unittest discover -s tests -t . -v

      - name: selftest
        run: navhack selftest

      - name: import surface
        run: python -c "import navhack; print(navhack.__version__)"

  termux-branches:
    name: termux (emulated branches)
    runs-on: ubuntu-latest
    env:
      TERMUX_VERSION: "0.118"
      PREFIX: /data/data/com.termux/files/usr
      TMPDIR: ${{ github.workspace }}/tmp
      NAVHACK_HOME: ${{ github.workspace }}/.navhack-ci
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: mkdir -p "$TMPDIR"
      - run: python navhack.py doctor
      - run: python navhack.py selftest
      - run: python -m unittest discover -s tests -t .
        env:
          PYTHONPATH: src

  no-install:
    name: zero-install launcher
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python navhack.py version
      - run: python navhack.py --help
      - run: python navhack.py selftest
